[project]
name = "blog-finance"
version = "0.1.0"
description = "金融基础 Notebook 教程（Jupyter Book 2 / MyST）"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "beautifulsoup4>=4.15.0",
  "cvxpy>=1.9.3",
  "matplotlib>=3.11.2",
  "nasdaq-data-link>=1.0.4",
  "numpy>=2.5.5",
  "openpyxl>=3.1.5",
  "pandas>=3.1.1",
  "plotly>=7.1.0",
  "requests>=2.34.2",
  "scikit-learn>=1.9.1",
  "scipy>=1.18.1",
  "yfinance>=1.8.0",
]

[dependency-groups]
# 构建站点：jupyter book build --html
book = [
  "jupyter-book>=2.1.7",
]
# 执行笔记本：jupyter book build --html --execute
exec = [
  "ipykernel>=7.4.0",
  "jupyter-server>=2.21.1",
]
dev = [
  "ruff>=0.17.5",
]

# 本项目是 Notebook 集合，不产出 wheel
[tool.uv]
package = false
default-groups = ["dev", "book"]

[tool.ruff]
fix = true
target-version = "py314"
line-length = 88

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 60
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.ruff.lint]
extend-select = [
  "DTZ",
  "E",
  "F",
  "I",
  "ISC",
  "NPY",
  "PERF",
  "RUF",
  "S",
  "SIM",
  "TID",
  "UP",
  "W",
]
fixable = ["ALL"]
ignore = [
  "E501",
  "ISC001",
  "RUF001",
  "RUF002",
  "RUF003",
  "S101",
  "S603",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true
force-wrap-aliases = true
order-by-type = true

[[tool.uv.index]]
url = "https://pypi.mirrors.ustc.edu.cn/simple"
default = true
