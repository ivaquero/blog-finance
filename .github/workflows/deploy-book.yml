name: deploy-book

# Build the Jupyter Book 2 site and publish it to GitHub Pages
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  # The site is served from https://<org>.github.io/<repo>/, so every asset
  # URL must be prefixed with the repository name.
  BASE_URL: /${{ github.event.repository.name }}
  # pyproject.toml points uv at a China mirror for local development; the
  # runner is outside China, so resolve against upstream PyPI here.
  UV_DEFAULT_INDEX: https://pypi.org/simple

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued in between
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # setup-uv no longer publishes floating major tags (v8+), so this must be
      # pinned to a full version tag; `@v10` does not resolve.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # Jupyter Book 2 runs on the MyST Document Engine (Node.js)
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: uv sync --group book

      # Notebook execution is disabled by default: the build reuses the
      # outputs stored in the .ipynb files. Add --execute (and the `exec`
      # dependency group) to recompute them here.
      - name: Build the book
        run: uv run --no-sync jupyter book build --html --ci

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
